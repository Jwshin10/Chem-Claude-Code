<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valence AP Chemistry</title>
<meta name="description" content="Interactive visualizations for every unit of AP Chemistry: IMFs, Lewis structures, VSEPR, kinetics, equilibrium, titrations, electrochemistry and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Valence (AP Chemistry) — layout concept: a lab instrument panel. A periodic-table-style
   tile marks every topic (unit.topic number + a two-letter "symbol"), the sidebar is the
   table of contents, and each topic page is a bench of interactive panels. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --surface-2: #f4f7fa;
  --surface-3: #e4eaf0;
  --ink: #142231;
  --ink-2: #44566a;
  --ink-3: #78889a;
  --line: #d8e0e8;
  --accent: #1f5fcc;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebfa;
  --good: #188a52;
  --warn: #b97300;
  --bad: #cf3535;
  --c-red: #e0413b;
  --c-blue: #2f6fe0;
  --c-green: #22a25a;
  --c-orange: #e8781c;
  --c-purple: #8650d6;
  --c-teal: #12a09c;
  --c-pink: #d44690;
  --c-yellow: #cf9c06;
  --c-gray: #6b7785;
  --u1: #4f5bd5; --u2: #0f8fc7; --u3: #11998e; --u4: #3a9d3f; --u5: #c08a00;
  --u6: #e0661b; --u7: #d63c47; --u8: #c4408f; --u9: #7d4fd0; --u0: #4a5a6c;
  --shadow: 0 1px 2px rgba(16, 32, 52, .06), 0 6px 20px rgba(16, 32, 52, .06);
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sidebar: 288px;
  --topbar: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #141b23; --surface-2: #19222c; --surface-3: #233040;
    --ink: #e5ecf3; --ink-2: #a7b4c2; --ink-3: #74838f; --line: #283543;
    --accent: #6b9dff; --accent-ink: #0c1117; --accent-soft: #1a2a45;
    --good: #3ccf86; --warn: #f0b13c; --bad: #ff6b6b;
    --c-red: #ff6a5f; --c-blue: #64a0ff; --c-green: #46d17f; --c-orange: #ff9a45;
    --c-purple: #ad86ff; --c-teal: #34d0c8; --c-pink: #ff74b9; --c-yellow: #f2c53d; --c-gray: #95a2b0;
    --u1: #8790ff; --u2: #3bb6ef; --u3: #2fcdbd; --u4: #66c66a; --u5: #e9b52a;
    --u6: #ff8a45; --u7: #ff6b74; --u8: #f070b6; --u9: #a985ff; --u0: #94a5b8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #141b23; --surface-2: #19222c; --surface-3: #233040;
  --ink: #e5ecf3; --ink-2: #a7b4c2; --ink-3: #74838f; --line: #283543;
  --accent: #6b9dff; --accent-ink: #0c1117; --accent-soft: #1a2a45;
  --good: #3ccf86; --warn: #f0b13c; --bad: #ff6b6b;
  --c-red: #ff6a5f; --c-blue: #64a0ff; --c-green: #46d17f; --c-orange: #ff9a45;
  --c-purple: #ad86ff; --c-teal: #34d0c8; --c-pink: #ff74b9; --c-yellow: #f2c53d; --c-gray: #95a2b0;
  --u1: #8790ff; --u2: #3bb6ef; --u3: #2fcdbd; --u4: #66c66a; --u5: #e9b52a;
  --u6: #ff8a45; --u7: #ff6b74; --u8: #f070b6; --u9: #a985ff; --u0: #94a5b8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.2rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: .95rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
sub, sup { font-size: .72em; line-height: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.tiny { font-size: .78rem; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--topbar);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-tile {
  width: 36px; height: 36px; border-radius: 8px; flex: none;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; position: relative;
  font: 700 17px/1 var(--font-display);
}
.brand-tile::before { content: "AP"; position: absolute; top: 3px; left: 4px; font: 600 7px/1 var(--font-mono); opacity: .8; }
.brand-name { font: 700 1.08rem/1.1 var(--font-display); white-space: nowrap; }
.brand-name span { color: var(--ink-3); font-weight: 500; }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center; flex: none;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn svg { width: 19px; height: 19px; }
#menuBtn { display: none; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: calc(100vh - var(--topbar)); }
.sidebar {
  position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--topbar) - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 14px 12px 40px;
}
.search { position: relative; margin-bottom: 10px; }
.search input[type="text"] {
  width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2);
}
.search input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 11px var(--font-mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.nav-home { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--ink); font-weight: 600; }
.nav-home:hover, .nav-home.active { background: var(--surface-2); }
.nav-unit { margin-top: 4px; }
.nav-unit > button {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 7px 8px; border: 0; background: none; cursor: pointer; border-radius: 9px; text-align: left;
}
.nav-unit > button:hover { background: var(--surface-2); }
.nav-unit .u-num {
  width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center;
  font: 700 12px/1 var(--font-mono); color: #fff; background: var(--uc);
}
.nav-unit .u-title { flex: 1; font-weight: 600; font-size: .9rem; line-height: 1.25; }
.nav-unit .chev { width: 14px; height: 14px; color: var(--ink-3); transition: transform .15s; }
.nav-unit.open .chev { transform: rotate(90deg); }
.nav-unit ul { list-style: none; margin: 2px 0 6px; padding: 0 0 0 21px; display: none; }
.nav-unit.open ul { display: block; }
.nav-unit li a {
  display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; border-radius: 8px;
  color: var(--ink-2); text-decoration: none; font-size: .88rem; border-left: 2px solid var(--line);
  border-radius: 0 8px 8px 0;
}
.nav-unit li a .n { font: 500 11px var(--font-mono); color: var(--ink-3); min-width: 24px; }
.nav-unit li a:hover { color: var(--ink); background: var(--surface-2); }
.nav-unit li a.active { color: var(--ink); background: var(--surface-2); border-left-color: var(--uc); font-weight: 600; }
.nav-empty { padding: 10px; color: var(--ink-3); font-size: .88rem; }
.nav-sep { height: 1px; background: var(--line); margin: 12px 6px; }

.scrim { display: none; }

main { min-width: 0; padding-inline: clamp(16px, 3vw, 40px); padding-block: 26px 60px; }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---------- topic header ---------- */
.page-head { display: flex; gap: 18px; align-items: flex-start; }
.tile {
  --uc: var(--u0);
  width: 64px; height: 64px; flex: none; border-radius: 12px; position: relative;
  background: var(--uc); color: #fff; display: grid; place-items: center;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
}
.tile .t-n { position: absolute; top: 5px; left: 7px; font: 600 10px/1 var(--font-mono); opacity: .9; }
.tile .t-s { font: 700 26px/1 var(--font-display); margin-top: 6px; }
.tile.sm { width: 42px; height: 42px; border-radius: 9px; }
.tile.sm .t-n { font-size: 8px; top: 4px; left: 5px; }
.tile.sm .t-s { font-size: 17px; margin-top: 5px; }
.eyebrow { font: 600 .74rem/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--uc, var(--ink-3)); }
.page-head p.lede { color: var(--ink-2); margin-top: 6px; max-width: 70ch; }
.page-head .titles { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

details.key-ideas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.key-ideas summary {
  cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px;
}
details.key-ideas summary::-webkit-details-marker { display: none; }
details.key-ideas summary::before { content: "+"; font: 600 15px var(--font-mono); color: var(--uc); width: 14px; }
details.key-ideas[open] summary::before { content: "−"; }
details.key-ideas ul { margin: 0; padding: 0 20px 14px 40px; display: grid; gap: 6px; color: var(--ink-2); }
details.key-ideas li::marker { color: var(--uc); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.pager a {
  display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink);
  min-width: 0; flex: 1 1 220px; max-width: 48%;
}
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; margin-left: auto; }
.pager .lbl { font: 500 .74rem var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }

/* ---------- panels & layout helpers ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.panel > h3 { display: flex; align-items: center; gap: 8px; }
.panel-sub { color: var(--ink-2); font-size: .9rem; margin-top: -6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-viz { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { align-items: flex-end; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.controls > .field { flex: 1 1 180px; }
.grow { flex: 1; }

/* ---------- form controls ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.field .val { font: 500 .84rem var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
select, input[type="text"], input[type="number"] {
  width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line);
  background: var(--surface-2); min-width: 0;
}
select { cursor: pointer; }
input[type="number"] { font-family: var(--font-mono); }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0; height: 22px; cursor: pointer; }
.btn {
  display: inline-block; text-align: center; text-decoration: none; line-height: 1.35;
  padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--ink);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 10px; font-size: .8rem; white-space: normal; text-align: left; }
.btn { max-width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: .88rem; cursor: pointer; user-select: none; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: .92rem;
  color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--uc, var(--accent)); }
.tab-body { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; min-width: 0; }

/* ---------- canvas ---------- */
.canvas-wrap { position: relative; width: 100%; min-width: 0; }
canvas.viz { display: block; width: 100%; border-radius: 10px; background: var(--surface-2); }
canvas.viz.drag { touch-action: none; cursor: grab; }
canvas.viz.drag:active { cursor: grabbing; }
.canvas-hint { position: absolute; right: 10px; bottom: 8px; font-size: .74rem; color: var(--ink-3); pointer-events: none; }

/* ---------- readouts ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 12px; min-width: 0; }
.stat .k { font-size: .78rem; color: var(--ink-3); font-weight: 600; }
.stat .v { font: 500 1.05rem/1.35 var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .9rem; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-family: var(--font-mono); overflow-wrap: anywhere; }
.callout {
  border-radius: var(--radius-sm); padding: 11px 14px; background: var(--accent-soft); color: var(--ink);
  font-size: .92rem; border-left: 3px solid var(--accent);
}
.callout.good { background: color-mix(in srgb, var(--good) 13%, var(--surface)); border-left-color: var(--good); }
.callout.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-left-color: var(--warn); }
.callout.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-left-color: var(--bad); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600;
  background: var(--surface-3); color: var(--ink);
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.off { opacity: .4; text-decoration: line-through; }
.eq { font-family: var(--font-mono); background: var(--surface-2); padding: 10px 14px; border-radius: var(--radius-sm); overflow-x: auto; white-space: nowrap; font-size: .92rem; }
.eq.wrap { white-space: normal; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.big-num { font: 600 2rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
table.data { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); font-size: .8rem; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.num { font-family: var(--font-mono); text-align: right; }
table.data tr.hl td { background: var(--accent-soft); }
table.data.clickable tbody tr { cursor: pointer; }
table.data.clickable tbody tr:hover td { background: var(--surface-2); }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; overflow: hidden; }
.hero h1 { font-size: clamp(1.9rem, 1.3rem + 2.2vw, 2.9rem); }
.hero p { color: var(--ink-2); margin-top: 10px; max-width: 52ch; font-size: 1.02rem; }
.hero .row { margin-top: 18px; }
.hero canvas { aspect-ratio: 4 / 3; max-width: 100%; height: auto; }
.hero-stats { display: flex; gap: 22px; margin-top: 20px; flex-wrap: wrap; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats b { font: 600 1.6rem/1 var(--font-mono); }
.hero-stats span { font-size: .8rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.units-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.unit-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.unit-card header { display: flex; gap: 12px; align-items: center; }
.unit-card header .eyebrow { display: block; }
.unit-card ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.unit-card li a { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.unit-card li a:hover { background: var(--surface-2); }
.unit-card li .sym { font: 700 .8rem/1 var(--font-mono); color: var(--uc); width: 30px; flex: none; }
.unit-card li .d { color: var(--ink-3); font-size: .8rem; display: block; line-height: 1.3; }
.featured { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.feat { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-decoration: none; color: var(--ink); }
.feat:hover { border-color: var(--uc); }
.feat b { display: block; font-size: .95rem; }
.feat > div > span { font-size: .8rem; color: var(--ink-3); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 8px; }

/* ---------- quiz ---------- */
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.q-opts { display: grid; gap: 8px; }
.q-opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; display: flex; gap: 10px; align-items: baseline; color: var(--ink); }
.q-opt:hover:not(:disabled) { border-color: var(--accent); }
.q-opt .letter { font: 600 .85rem var(--font-mono); color: var(--ink-3); }
.q-opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.q-opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.q-opt:disabled { cursor: default; }
.progress { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* ---------- periodic table ---------- */
.ptable-wrap { overflow-x: auto; padding-bottom: 4px; }
.ptable { display: grid; grid-template-columns: repeat(18, minmax(34px, 1fr)); gap: 3px; min-width: 660px; }
.el {
  aspect-ratio: 1 / 1.08; border-radius: 6px; border: 1px solid transparent; cursor: pointer; padding: 2px 3px;
  display: flex; flex-direction: column; justify-content: space-between; min-width: 0; position: relative;
  background: var(--surface-3); color: var(--ink); font-size: 10px; line-height: 1; text-align: left;
}
.el:hover { outline: 2px solid var(--ink); z-index: 2; }
.el.sel { outline: 3px solid var(--accent); z-index: 3; }
.el .z { font: 500 8px var(--font-mono); opacity: .8; }
.el .s { font: 700 clamp(11px, 1.2vw, 15px)/1 var(--font-display); text-align: center; }
.el .m { font: 500 7.5px var(--font-mono); text-align: center; opacity: .8; white-space: nowrap; overflow: hidden; }
.el.blank { visibility: hidden; }
.el.ph { background: none; border: 1px dashed var(--line); cursor: default; font-size: 8px; color: var(--ink-3); justify-content: center; align-items: center; }
.el.ph:hover { outline: 0; }
.el.dim { opacity: .25; }

/* ---------- orbital boxes ---------- */
.orbitals { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.subshell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.subshell .boxes { display: flex; }
.obox { width: 30px; height: 34px; border: 1.5px solid var(--ink-2); margin-left: -1.5px; display: grid; place-items: center; font: 700 15px/1 var(--font-body); color: var(--accent); background: var(--surface); }
.obox:first-child { margin-left: 0; }
.subshell .lab { font: 600 .8rem var(--font-mono); color: var(--ink-2); }

/* ---------- misc ---------- */
.err { padding: 16px; border-radius: var(--radius); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--ink); }
.swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; vertical-align: -2px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.formula { font-family: var(--font-body); font-weight: 600; }
.lewis-steps { display: flex; flex-wrap: wrap; gap: 6px; }
.toc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hide-sm { }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

@media (max-width: 1000px) {

}

  .tile .t-s { font-size: 21px; }

<header class="topbar">

</header>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search topics" autocomplete="off" spellcheck="false" aria-label="Search topics">
      <kbd>/</kbd>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main id="main"></main>
</div>
<script>
/* ---- js/core.js ---- */
/* Core: module registry, DOM helpers, controls, canvas + plotting utilities.
   Every topic module calls App.register({...}) with:
     id, unit (1-9, or 0 for tools), sym (2-letter tile symbol), title, desc,
     tags (search words), keyIdeas (list of strings), render(el, scope)
   render() builds UI inside `el`; anything animated/listening must go through `scope`
   (scope.loop / scope.on / scope.timeout) so it is torn down on navigation. */
'use strict';

const App = {
  modules: [],
  byId: {},
  units: [
    { n: 1, title: 'Atomic Structure & Properties' },
    { n: 2, title: 'Compound Structure & Properties' },
    { n: 3, title: 'Intermolecular Forces & Properties' },
    { n: 4, title: 'Chemical Reactions' },
    { n: 5, title: 'Kinetics' },
    { n: 6, title: 'Thermodynamics' },
    { n: 7, title: 'Equilibrium' },
    { n: 8, title: 'Acids & Bases' },
    { n: 9, title: 'Applications of Thermodynamics' },
    { n: 0, title: 'Study Tools' },
  ],
  register(m) {
    m.tags = m.tags || [];
    m.keyIdeas = m.keyIdeas || [];
    this.modules.push(m);
    this.byId[m.id] = m;
  },
  unitModules(n) { return this.modules.filter(m => m.unit === n); },
  number(m) {
    if (m.unit === 0) return 'T' + (this.unitModules(0).indexOf(m) + 1);
    return m.unit + '.' + (this.unitModules(m.unit).indexOf(m) + 1);
  },
};

const U = {};

/* ---------------- DOM ---------------- */
U.h = (tag, props, ...kids) => {
  const el = document.createElement(tag);
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  U.append(el, kids);
  return el;
};
U.append = (el, kids) => {
  for (const k of [kids].flat(Infinity)) {
    if (k == null || k === false) continue;
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
};
U.html = (tag, cls, html) => U.h(tag, { class: cls, html });
U.clear = el => { while (el.firstChild) el.removeChild(el.firstChild); return el; };
U.esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- lifecycle scope ---------------- */
class Scope {
  constructor() { this.fns = []; this.dead = false; }
  add(fn) { if (this.dead) { try { fn(); } catch (e) { console.error(e); } } else this.fns.push(fn); return fn; }
  loop(fn) {
    let id = 0, last = performance.now();
    const tick = t => {
      if (this.dead) return;
      const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
      last = t;
      let r;
      try { r = fn(dt, t); } catch (e) { console.error(e); r = false; }
      if (r !== false) id = requestAnimationFrame(tick);
    };
    id = requestAnimationFrame(tick);
    const stop = () => cancelAnimationFrame(id);
    this.add(stop);
    return stop;
  }
  on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); this.add(() => target.removeEventListener(ev, fn, opt)); }
  timeout(fn, ms) { const id = setTimeout(fn, ms); this.add(() => clearTimeout(id)); return id; }
  interval(fn, ms) { const id = setInterval(fn, ms); this.add(() => clearInterval(id)); return id; }
  child() { const c = new Scope(); this.add(() => c.dispose()); return c; }
  dispose() {
    if (this.dead) return;
    this.dead = true;
    for (const f of this.fns.splice(0).reverse()) { try { f(); } catch (e) { console.error(e); } }
  }
}
U.Scope = Scope;

/* ---------------- storage (never throws) ---------------- */
U.store = {
  get(k, d) { try { const v = localStorage.getItem('apchem:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('apchem:' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};

/* ---------------- numbers ---------------- */
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '+': '⁺', '−': '⁻' };
const SUB = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
U.supText = s => String(s).split('').map(c => SUP[c] || c).join('');
U.subText = s => String(s).split('').map(c => SUB[c] || c).join('');
/** significant-figure formatting; scientific notation (with unicode superscripts) when very large/small */
U.sig = (x, s = 3) => {
  if (x == null || !isFinite(x)) return '—';
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3) {
    let e = Math.floor(Math.log10(a));
    let m = x / Math.pow(10, e);
    if (Math.abs(+m.toPrecision(s)) >= 10) { m /= 10; e++; }
    return m.toPrecision(s) + '×10' + U.supText(e);
  }
  if (a >= Math.pow(10, s)) return String(Math.round(x));
  return x.toPrecision(s);
};
U.fix = (x, d = 2) => (x == null || !isFinite(x)) ? '—' : (Math.abs(x) < 0.5 * Math.pow(10, -d) ? (0).toFixed(d) : x.toFixed(d));
U.clamp = (x, a, b) => Math.max(a, Math.min(b, x));
U.lerp = (a, b, t) => a + (b - a) * t;
U.rand = (a, b) => a + Math.random() * (b - a);
U.randInt = (a, b) => Math.floor(U.rand(a, b + 1));
U.pick = arr => arr[Math.floor(Math.random() * arr.length)];
/** deterministic, uncorrelated pseudo-random numbers in [0,1) for laying out particles */
const frac = x => x - Math.floor(x);
U.hx = k => frac(Math.sin(k * 127.1 + 311.7) * 43758.5453);
U.hy = k => frac(Math.sin(k * 269.5 + 183.3) * 43758.5453);
U.signed = (x, d = 1) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
U.gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
/** solve f(x)=0 on [a,b] by bisection (f(a), f(b) of opposite sign) */
U.bisect = (f, a, b, it = 200) => {
  let fa = f(a);
  for (let i = 0; i < it; i++) {
    const m = (a + b) / 2, fm = f(m);
    if (fa * fm <= 0) b = m; else { a = m; fa = fm; }
  }
  return (a + b) / 2;
};

/* ---------------- chemistry text ---------------- */
/** "SO4^2-" -> SO<sub>4</sub><sup>2−</sup>; "->" -> →; "<=>" -> ⇌ */
U.chem = s => String(s)
  .replace(/<=>/g, '⇌').replace(/->/g, '→')
  .replace(/([A-Za-z)\]])(\d+)/g, '$1<sub>$2</sub>')
  .replace(/\^(\d*[+\-−])/g, (m, c) => '<sup>' + c.replace('-', '−') + '</sup>');
/** same as U.chem but plain unicode (for canvas) */
U.chemText = s => String(s)
  .replace(/<=>/g, '⇌').replace(/->/g, '→')
  .replace(/([A-Za-z)\]])(\d+)/g, (m, a, d) => a + U.subText(d))
  .replace(/\^(\d*[+\-−])/g, (m, c) => U.supText(c));
U.chemEl = (s, tag = 'span') => U.h(tag, { class: 'formula', html: U.chem(s) });

/* ---------------- theme colours for canvas ---------------- */
let themeCache = null;
U.theme = () => {
  if (themeCache) return themeCache;
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue('--' + n).trim();
  themeCache = {
    bg: g('bg'), surface: g('surface'), surface2: g('surface-2'), surface3: g('surface-3'),
    ink: g('ink'), ink2: g('ink-2'), ink3: g('ink-3'), line: g('line'), accent: g('accent'),
    good: g('good'), warn: g('warn'), bad: g('bad'),
    red: g('c-red'), blue: g('c-blue'), green: g('c-green'), orange: g('c-orange'), purple: g('c-purple'),
    teal: g('c-teal'), pink: g('c-pink'), yellow: g('c-yellow'), gray: g('c-gray'),
    dark: document.documentElement.dataset.theme === 'dark' ||
      (document.documentElement.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches),
    u: n => g('u' + n),
  };
  return themeCache;
};
U.liveCanvases = new Set();
U.themeChanged = () => {
  themeCache = null;
  for (const c of U.liveCanvases) { try { c.draw && c.draw(c.ctx, c.w, c.h); } catch (e) { console.error(e); } }
};

/* colour helpers */
U.hexToRgb = hex => {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
U.rgb = (r, g, b, a = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a})`;
U.alpha = (hex, a) => { const [r, g, b] = U.hexToRgb(hex); return U.rgb(r, g, b, a); };
U.shade = (hex, amt) => { // amt -1..1 (negative darkens)
  const [r, g, b] = U.hexToRgb(hex);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return U.rgb(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p);
};
U.mix = (h1, h2, t) => { const a = U.hexToRgb(h1), b = U.hexToRgb(h2); return U.rgb(U.lerp(a[0], b[0], t), U.lerp(a[1], b[1], t), U.lerp(a[2], b[2], t)); };
U.lum = hex => { const [r, g, b] = U.hexToRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
/** sequential colour ramp t in [0,1] (blue -> teal -> yellow -> red) */
U.ramp = t => {
  const stops = ['#2c4fb8', '#2b8fd6', '#25b3a1', '#9ccc3c', '#f2c12e', '#ee7d22', '#d9342b'];
  t = U.clamp(t, 0, 1) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(t));
  return U.mix(stops[i], stops[i + 1], t - i);
};

/* CPK-style element colours */
U.CPK = {
  H: '#f4f6f8', He: '#7fe3f0', Li: '#b07cf0', Be: '#b6d84a', B: '#f2a39a', C: '#50565f', N: '#3d6ae0', O: '#e5413b',
  F: '#6fd27a', Ne: '#6fd0e8', Na: '#9a62f0', Mg: '#46c486', Al: '#a9aec4', Si: '#d8b88e', P: '#f08a24', S: '#ecc53a',
  Cl: '#33b34f', Ar: '#5cc4dc', K: '#8c4fd0', Ca: '#4caf6a', Fe: '#d0702e', Cu: '#c8783a', Zn: '#7f84b4', Br: '#a8402e',
  Kr: '#4cb8d0', Ag: '#b8bcc6', I: '#7b4ac8', Xe: '#3fb0c4', Au: '#e3b843', Pb: '#5c6070', Mn: '#9c7ac8', Cr: '#8a99c7',
  Co: '#e88aa0', Ni: '#59b06a', Sn: '#8a8fa0', Ba: '#3faf7a', Sr: '#3faf8a', Cs: '#7a4abf', Rb: '#8a50c8', Hg: '#b8b8d0',
  Se: '#f0a020', As: '#bd80e3', Ge: '#6f8f8f', Sb: '#9e63b5', Te: '#d47a00', X: '#c084fc',
};
U.elColor = el => U.CPK[el] || '#d48fd0';

/** shaded sphere atom */
U.drawAtom = (ctx, x, y, r, el, opts = {}) => {
  const col = opts.color || U.elColor(el);
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, U.shade(col, 0.55));
  g.addColorStop(0.55, col);
  g.addColorStop(1, U.shade(col, -0.35));
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  ctx.fillStyle = g; ctx.fill();
  if (el === 'H' || opts.outline) { ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1; ctx.stroke(); }
  if (opts.label !== false && r >= 7) {
    ctx.fillStyle = U.lum(col) > 0.62 ? '#1b2530' : '#ffffff';
    ctx.font = `600 ${Math.round(r * (String(opts.label || el).length > 2 ? 0.62 : 0.85))}px ${U.FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(opts.label || el, x, y + 0.5);
  }
  ctx.globalAlpha = 1;
};
U.FONT = '"IBM Plex Sans", system-ui, sans-serif';
U.MONO = '"IBM Plex Mono", ui-monospace, monospace';

/** arrow from (x1,y1) to (x2,y2) */
U.arrow = (ctx, x1, y1, x2, y2, color, w = 2, head = 9) => {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * 0.6, y2 - Math.sin(a) * head * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(a - 0.42), y2 - head * Math.sin(a - 0.42));
  ctx.lineTo(x2 - head * Math.cos(a + 0.42), y2 - head * Math.sin(a + 0.42));
  ctx.closePath(); ctx.fill();
};
U.text = (ctx, s, x, y, o = {}) => {
  ctx.font = `${o.weight || 500} ${o.size || 12}px ${o.mono ? U.MONO : U.FONT}`;
  ctx.fillStyle = o.color || U.theme().ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(s, x, y);
};
U.roundRect = (ctx, x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
};

/* ---------------- canvas ---------------- */
/** responsive HiDPI canvas. opts: height (px | fn(width)), aspect, draw(ctx,w,h), scope, drag (bool) */
U.canvas = (parent, opts = {}) => {
  const wrap = U.h('div', { class: 'canvas-wrap' });
  const cv = U.h('canvas', { class: 'viz' + (opts.drag ? ' drag' : '') });
  wrap.appendChild(cv);
  if (opts.hint) wrap.appendChild(U.h('div', { class: 'canvas-hint' }, opts.hint));
  if (parent) parent.appendChild(wrap);
  const o = { wrap, canvas: cv, ctx: cv.getContext('2d'), w: 0, h: 0, draw: opts.draw || null };
  o.resize = noDraw => {
    const w = Math.round(wrap.clientWidth) || o.w || 600;
    const h = Math.round(opts.height ? (typeof opts.height === 'function' ? opts.height(w) : opts.height) : w / (opts.aspect || 1.6));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
    cv.style.height = h + 'px';
    o.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.w = w; o.h = h;
    if (o.draw && noDraw !== true) o.draw(o.ctx, w, h);
  };
  o.redraw = () => { if (o.draw) { o.ctx.clearRect(0, 0, o.w, o.h); o.draw(o.ctx, o.w, o.h); } };

/** parse "Ca(OH)2", "CuSO4·5H2O", "Fe2(SO4)3" -> {Ca:1, O:2, H:2}; throws on bad input */
U.parseFormula = str => {
  let s = String(str).replace(/\s+/g, '').replace(/\^?\d*[+\-]$/, '').replace(/\((s|l|g|aq)\)$/i, '');
  const parts = s.split(/[·.*]/);
  const total = {};
  for (let part of parts) {
    let mult = 1;
    const m = part.match(/^(\d+)(.*)$/);
    if (m) { mult = +m[1]; part = m[2]; }
    const counts = parseGroup(part);
    for (const k in counts) total[k] = (total[k] || 0) + counts[k] * mult;
  }
  if (!Object.keys(total).length) throw new Error('Empty formula');
  return total;
  function parseGroup(p) {
    const stack = [{}];
    let i = 0;
    while (i < p.length) {
      const ch = p[i];
      if (ch === '(' || ch === '[') { stack.push({}); i++; }
      else if (ch === ')' || ch === ']') {
        i++;
        let n = ''; while (i < p.length && /\d/.test(p[i])) n += p[i++];
        const top = stack.pop();
        if (!stack.length) throw new Error('Unbalanced parentheses');
        const k = n ? +n : 1;
        for (const e in top) stack[stack.length - 1][e] = (stack[stack.length - 1][e] || 0) + top[e] * k;
      } else if (/[A-Z]/.test(ch)) {
        let sym = ch; i++;
        while (i < p.length && /[a-z]/.test(p[i])) sym += p[i++];
        let n = ''; while (i < p.length && /\d/.test(p[i])) n += p[i++];
        if (!(typeof ELEMENTS !== 'undefined' && ELEMENTS.bySym[sym])) throw new Error('Unknown element "' + sym + '"');
        const cur = stack[stack.length - 1];
        cur[sym] = (cur[sym] || 0) + (n ? +n : 1);
      } else throw new Error('Unexpected "' + ch + '"');
    }
    if (stack.length !== 1) throw new Error('Unbalanced parentheses');
    return stack[0];
  }
};
U.molarMass = formula => {
  const c = U.parseFormula(formula);
  let m = 0;
  for (const k in c) m += ELEMENTS.bySym[k].mass * c[k];
  return m;
};

})();

            const g = n * M, p = n * K.NA;

            const F = U.chem(formula);
            const lines = [];
            if (unit === 'g') lines.push(`${U.sig(g, 4)} g ${F} × (1 mol / ${M.toFixed(2)} g) = <b>${U.sig(n, 4)} mol</b>`);
            if (unit === 'p') lines.push(`${U.sig(p, 4)} particles × (1 mol / 6.022×10²³) = <b>${U.sig(n, 4)} mol</b>`);
            if (unit !== 'g') lines.push(`${U.sig(n, 4)} mol × (${M.toFixed(2)} g / 1 mol) = <b>${U.sig(g, 4)} g</b>`);
            if (unit !== 'p') lines.push(`${U.sig(n, 4)} mol × (6.022×10²³ / 1 mol) = <b>${U.sig(p, 4)} formula units</b>`);
            lines.push(`${U.sig(p, 4)} formula units × ${atoms} atoms each = <b>${U.sig(p * atoms, 4)} atoms</b> total`);

      {
        label: 'Empirical formula', render(b) {
          const rows = [['C', 40.00], ['H', 6.71], ['O', 53.29], ['', 0]];
          let MM = 180.16;
          const out = h('div', { class: 'stack' });
          const inputs = h('div', { class: 'stack' });
          rows.forEach((r, i) => {
            const s = U.textInput({ label: 'Element ' + (i + 1), value: r[0], placeholder: 'symbol', onInput: v => { rows[i][0] = v.trim(); calc(); } });
            const p = U.numInput({ label: 'Mass %', value: r[1] || '', onInput: v => { rows[i][1] = v; calc(); } });
            p.input.addEventListener('input', () => { if (p.input.value === '') { rows[i][1] = 0; calc(); } });
            inputs.appendChild(h('div', { class: 'controls' }, s.el, p.el));
          });
          const mm = U.numInput({ label: 'Molar mass (optional, g/mol)', value: MM, onInput: v => { MM = v; calc(); } });
          mm.input.addEventListener('input', () => { if (mm.input.value === '') { MM = 0; calc(); } });
          b.append(h('div', { class: 'grid2' }, U.panel('Percent composition', inputs, mm.el, h('p', { class: 'small muted' }, 'Example: glucose. Assume a 100 g sample so each % becomes grams.')), out));
          function calc() {
            U.clear(out);
            const used = rows.filter(r => r[0] && r[1] > 0);
            for (const r of used) if (!ELEMENTS.bySym[r[0]]) { out.appendChild(U.callout(`“${r[0]}” is not an element symbol.`, 'bad')); return; }
            if (used.length < 2) { out.appendChild(U.callout('Enter at least two elements with their mass percents.', 'warn')); return; }
            const tot = used.reduce((t, r) => t + r[1], 0);
            const mol = used.map(r => r[1] / ELEMENTS.bySym[r[0]].mass);
            const min = Math.min(...mol);
            const ratio = mol.map(m => m / min);
            let k = 1;
            for (let t = 1; t <= 8; t++) { if (ratio.every(x => Math.abs(x * t - Math.round(x * t)) < 0.12)) { k = t; break; } if (t === 8) k = 1; }
            const ints = ratio.map(x => Math.max(1, Math.round(x * k)));
            const emp = {}; used.forEach((r, i) => emp[r[0]] = ints[i]);
            const empMass = used.reduce((t, r, i) => t + ELEMENTS.bySym[r[0]].mass * ints[i], 0);
            const tbl = U.table(['Element', 'Mass in 100 g', 'Moles', '÷ smallest', k > 1 ? '× ' + k : 'Ratio'],
              used.map((r, i) => [r[0], r[1].toFixed(2) + ' g', mol[i].toFixed(4), ratio[i].toFixed(3), ints[i]]), { num: [1, 2, 3, 4] });
            const res = [tbl, h('div', { class: 'eq', html: `Empirical formula: <b>${formulaHtml(emp)}</b> &nbsp; (empirical mass ${empMass.toFixed(2)} g/mol)` })];
            if (Math.abs(tot - 100) > 1) res.push(U.callout(`Percents add to ${tot.toFixed(1)}%, not 100%. Check the data.`, 'warn'));
            if (k > 1) res.push(U.callout(`The mole ratios were not whole numbers, so all were multiplied by ${k}.`));
            if (MM > 0) {
              const mult = MM / empMass, r = Math.round(mult);
              if (r >= 1 && Math.abs(mult - r) < 0.08) {
                const mol2 = {}; Object.keys(emp).forEach(s => mol2[s] = emp[s] * r);
                res.push(h('div', { class: 'eq', html: `${MM} ÷ ${empMass.toFixed(2)} = ${mult.toFixed(2)} ≈ ${r} → molecular formula <b>${formulaHtml(mol2)}</b>` }));
              } else res.push(U.callout(`Molar mass ÷ empirical mass = ${mult.toFixed(2)}, which is not close to a whole number.`, 'warn'));
            }
            out.appendChild(U.panel('Solution', ...res));
          }
          calc();
        },
      },
    ], scope, { key: 'moles' });
  },
});

'use strict';
App.register({
  id: 'mass-spec', unit: 1, sym: 'Ms', title: 'Mass Spectrometry',
  desc: 'Watch ions separate by mass, read isotope peaks, and calculate average atomic mass.',
  tags: ['isotopes', 'mass spectrum', 'average atomic mass', 'abundance', 'm/z'],
  keyIdeas: [
    'A mass spectrum shows each isotope as a peak: position = mass (m/z), height = relative abundance.',
    'Average atomic mass = Σ (isotope mass × fractional abundance). It is closer to the most abundant isotope.',
    'Lighter ions are deflected more by the magnetic field, which is how the instrument separates isotopes.',
    'Diatomic elements such as Cl<sub>2</sub> show peaks for each isotope combination (for Cl<sub>2</sub>: 70, 72, 74 in a 9 : 6 : 1 ratio).',
  ],
  render(el, scope) {
    const h = U.h;
    const ISO = {
      Li: [[6.015, 7.59], [7.016, 92.41]], B: [[10.013, 19.9], [11.009, 80.1]], C: [[12.000, 98.93], [13.003, 1.07]],
      Ne: [[19.992, 90.48], [20.994, 0.27], [21.991, 9.25]], Mg: [[23.985, 78.99], [24.986, 10.00], [25.983, 11.01]],
      Si: [[27.977, 92.23], [28.976, 4.68], [29.974, 3.09]], Cl: [[34.969, 75.78], [36.966, 24.22]],
      Cu: [[62.930, 69.15], [64.928, 30.85]], Ga: [[68.926, 60.11], [70.925, 39.89]], Br: [[78.918, 50.69], [80.916, 49.31]],
      Zr: [[89.905, 51.45], [90.906, 11.22], [91.905, 17.15], [93.906, 17.38], [95.908, 2.80]], Ag: [[106.905, 51.84], [108.905, 48.16]],
    };
    let sym = 'Cl', diatomic = false, mystery = false, guessResult = null;
    const ISO_COLORS = () => { const t = U.theme(); return [t.blue, t.orange, t.green, t.purple, t.pink, t.teal]; };

    const peaks = () => {
      const iso = ISO[sym].map(([m, a]) => [m, a / 100]);
      if (!diatomic) return iso.map(([m, f], i) => ({ m, f, label: Math.round(m) + sym, ci: i }));
      const out = {};
      iso.forEach(([m1, f1], i) => iso.forEach(([m2, f2], j) => {
        if (j < i) return;
        const key = Math.round(m1 + m2);
        const f = f1 * f2 * (i === j ? 1 : 2);
        out[key] = out[key] || { m: m1 + m2, f: 0, label: key + '', ci: i + j };
        out[key].f += f;
      }));
      return Object.values(out).sort((a, b) => a.m - b.m);
    };

    const sel = U.select({ label: 'Element', options: Object.keys(ISO).map(s => ({ value: s, label: `${ELEMENTS.bySym[s].name} (${s})` })), value: sym, onChange: v => { sym = v; guessResult = null; update(); } });
    const dia = U.check({ label: 'Show as diatomic X₂ molecule', checked: false, onChange: v => { diatomic = v; update(); } });
    const mys = U.check({ label: 'Mystery mode (hide the element)', checked: false, onChange: v => { mystery = v; if (v) { sym = U.pick(Object.keys(ISO)); sel.set(sym); } guessResult = null; update(); } });
    const guessBox = h('div', { class: 'row' });
    const calcBox = h('div', { class: 'stack' });

    const left = h('div', { class: 'stack' });
    const right = h('div', { class: 'stack' });
    el.append(h('div', { class: 'grid-viz' }, left, right));

    // ---- instrument animation ----
    const ions = [];
    let spawn = 0;
    const inst = U.canvas(null, { aspect: 2.1, scope });
    left.appendChild(U.panel('Inside the mass spectrometer', inst.wrap, h('p', { class: 'small muted' }, 'Ions are accelerated, then bent by a magnetic field. The radius of the path grows with mass, so each isotope lands at a different spot on the detector.')));
    const specCv = U.canvas(null, { aspect: 1.9, scope, draw: drawSpectrum });
    left.appendChild(U.panel('Mass spectrum', specCv.wrap));
    right.append(U.panel('Sample', sel.el, dia.el, mys.el, guessBox), calcBox);

    function geom(w, hgt) {
      const ps = peaks();
      const ms = ps.map(p => p.m);
      const mMin = Math.min(...ms), mMax = Math.max(...ms);
      const sx = w * 0.18, sy = hgt * 0.82;
      const rFor = m => { const t = mMax === mMin ? 0.5 : (m - mMin) / (mMax - mMin); return hgt * (0.38 + 0.3 * t); };
      return { ps, sx, sy, rFor };
    }
    scope.loop(dt => {
      const c = inst.ctx, w = inst.w, H = inst.h, t = U.theme();
      c.clearRect(0, 0, w, H);
      const g = geom(w, H);
      // source & accelerator
      c.fillStyle = t.surface3; U.roundRect(c, 8, g.sy - 16, w * 0.1, 32, 6); c.fill();
      U.text(c, 'ion source', 10, g.sy + 30, { size: 11, color: t.ink3 });
      c.fillStyle = U.alpha(t.purple, 0.12); c.fillRect(g.sx, H * 0.04, w * 0.8, g.sy - H * 0.04 + 6);
      U.text(c, 'magnetic field region', w * 0.55, H * 0.12, { size: 11, color: t.purple, align: 'center', weight: 600 });
      // detector line at y = sy, to the right
      c.strokeStyle = t.ink2; c.lineWidth = 4;
      c.beginPath(); c.moveTo(g.sx + 2 * g.rFor(g.ps[0].m) - 30, g.sy + 2); c.lineTo(w - 10, g.sy + 2); c.stroke();
      U.text(c, 'detector', w - 12, g.sy + 20, { size: 11, color: t.ink3, align: 'right' });
      const cols = ISO_COLORS();
      // paths
      g.ps.forEach(p => {
        const r = g.rFor(p.m);
        c.strokeStyle = U.alpha(cols[p.ci % cols.length], 0.25); c.lineWidth = 1.5; c.setLineDash([4, 4]);
        c.beginPath(); c.arc(g.sx + r, g.sy, r, Math.PI, 2 * Math.PI); c.stroke(); c.setLineDash([]);
        const x = g.sx + 2 * r;
        c.fillStyle = cols[p.ci % cols.length];
        c.fillRect(x - 3, g.sy - 2 - p.f * 30, 6, p.f * 30 + 2);
        U.text(c, mystery ? Math.round(p.m) + '' : p.label, x, g.sy + 34, { size: 11, align: 'center', color: cols[p.ci % cols.length], weight: 600 });
      });
      // spawn ions weighted by abundance
      spawn += dt * 30;
      while (spawn > 1) {
        spawn--;
        let r = Math.random(), tot = g.ps.reduce((s, p) => s + p.f, 0), pick = g.ps[0];
        for (const p of g.ps) { r -= p.f / tot; if (r <= 0) { pick = p; break; } }
        ions.push({ p: pick, x: 20, phase: 0, a: Math.PI });
      }
      for (let i = ions.length - 1; i >= 0; i--) {
        const io = ions[i];
        const r = g.rFor(io.p.m);
        let x, y;
        if (io.phase === 0) { io.x += dt * w * 0.5; x = io.x; y = g.sy; if (io.x >= g.sx) io.phase = 1; }
        else { io.a += dt * (w * 0.5) / r; x = g.sx + r + r * Math.cos(io.a); y = g.sy + r * Math.sin(io.a); if (io.a >= 2 * Math.PI) { ions.splice(i, 1); continue; } }
        c.beginPath(); c.arc(x, y, 3.2, 0, 7); c.fillStyle = cols[io.p.ci % cols.length]; c.fill();
      }
      if (ions.length > 300) ions.splice(0, ions.length - 300);
    });

    function drawSpectrum(c, w, H) {
      const t = U.theme(), ps = peaks(), cols = ISO_COLORS();
      const ms = ps.map(p => p.m);
      const lo = Math.floor(Math.min(...ms)) - 2, hi = Math.ceil(Math.max(...ms)) + 2;
      const maxF = Math.max(...ps.map(p => p.f));
      const P = new U.Plot(c, w, H, { x: [lo, hi], y: [0, 105], xlabel: 'Mass-to-charge ratio (m/z)', ylabel: 'Relative abundance (%)', nx: Math.min(12, hi - lo + 1) });
      P.axes();
      ps.forEach(p => {
        const rel = p.f / maxF * 100;
        const x = P.X(p.m);
        c.fillStyle = cols[p.ci % cols.length];
        c.fillRect(x - 4, P.Y(rel), 8, P.B - P.Y(rel));
        U.text(c, (p.f * 100).toFixed(diatomic ? 1 : 2) + '%', x, P.Y(rel) - 6, { size: 11, align: 'center', color: t.ink2, mono: true });
      });
    }

    function update() {
      specCv.redraw();
      U.clear(guessBox); U.clear(calcBox);
      sel.el.hidden = mystery;
      const iso = ISO[sym];
      const avg = iso.reduce((s, [m, a]) => s + m * a / 100, 0);
      if (mystery && !guessResult) {
        const g = U.select({ label: 'Which element is it?', options: [{ value: '', label: 'Choose…' }].concat(Object.keys(ISO).map(s => ({ value: s, label: ELEMENTS.bySym[s].name }))), value: '', onChange: v => { guessResult = v === sym ? 'right' : 'wrong:' + v; update(); } });
        guessBox.append(g.el, U.btn('New mystery', () => { sym = U.pick(Object.keys(ISO)); guessResult = null; update(); }, 'sm'));
        calcBox.appendChild(U.callout('Use the peak positions and heights to estimate the average atomic mass, then match it to the periodic table.'));
        return;
      }
      if (mystery && guessResult) {
        guessBox.append(U.callout(guessResult === 'right' ? `Correct: ${ELEMENTS.bySym[sym].name}.` : `Not quite. It was ${ELEMENTS.bySym[sym].name} (average mass ${avg.toFixed(2)}).`, guessResult === 'right' ? 'good' : 'bad'),
          U.btn('Next mystery', () => { sym = U.pick(Object.keys(ISO)); guessResult = null; update(); }, 'sm primary'));
      }
      calcBox.appendChild(U.panel('Average atomic mass',
        U.table(['Isotope', 'Mass (u)', 'Abundance', 'Contribution'], iso.map(([m, a]) => [`<sup>${Math.round(m)}</sup>${sym}`, m.toFixed(3), a.toFixed(2) + '%', (m * a / 100).toFixed(3)]), { num: [1, 2, 3] }),
        h('div', { class: 'eq wrap', html: iso.map(([m, a]) => `(${m.toFixed(3)})(${(a / 100).toFixed(4)})`).join(' + ') + ` = <b>${avg.toFixed(3)} u</b>` }),
        h('p', { class: 'small muted', html: `Periodic table value: ${ELEMENTS.bySym[sym].mass} u. The average lies closest to <sup>${Math.round(iso.reduce((a, b) => (b[1] > a[1] ? b : a))[0])}</sup>${sym}, the most abundant isotope.` })));
      if (diatomic) calcBox.appendChild(U.callout(`Each ${sym}<sub>2</sub> molecule contains two atoms picked at random, so peak heights follow the products of the isotope fractions (e.g. f<sub>a</sub>² , 2f<sub>a</sub>f<sub>b</sub>, f<sub>b</sub>²).`));
    }
    update();
  },
});

  tags: ['periodic trends', 'electronegativity', 'atomic radius', 'ionization energy', 'electron affinity', 'groups', 'periods', 'shielding', 'effective nuclear charge'],
  keyIdeas: [

    'Down a group, electrons occupy higher shells farther from the nucleus with more shielding: radius ↑, ionization energy ↓, electronegativity ↓.',

    'Core electrons shield valence electrons from the full nuclear charge. A simple estimate: Z<sub>eff</sub> ≈ protons − core electrons.',
    'Across a period Z<sub>eff</sub> rises and the valence shell stays the same, so valence electrons are pulled closer and held more tightly.',
    'Down a group the valence shell is farther away, so attraction weakens even though Z<sub>eff</sub> is about the same.',
  ],
  render(el, scope) {

      {

          let A = 11, B = 17;

          const panels = [];

            const cv = U.canvas(null, { aspect: 1, scope: s });
            const stats = U.stats([['z', 'Protons'], ['core', 'Core e⁻'], ['val', 'Valence e⁻'], ['zeff', 'Z<sub>eff</sub> ≈'], ['r', 'Radius'], ['att', 'Relative pull']]);
            panels.push({ getZ, cv, stats });

          };
          b.append(h('div', { class: 'grid2' }, make(() => A, v => A = v), make(() => B, v => B = v)));
          const verdict = h('div');
          b.append(verdict);
          const shells = Z => { const c = ELEMENTS.config(Z); const n = {}; c.forEach(x => n[x.n] = (n[x.n] || 0) + x.e); return Object.keys(n).sort().map(k => n[k]); };
          const data = Z => {
            const sh = shells(Z), e = ELEMENTS.byZ[Z];
            const conf = ELEMENTS.config(Z), nmax = Math.max(...conf.map(x => x.n));
            const val = conf.filter(x => x.n === nmax).reduce((t, x) => t + x.e, 0);
            const core = Z - val, zeff = Z - core;

              c.clearRect(0, 0, w, H);
              const cx = w / 2, cy = H / 2;

              const n = d.sh.length;
              const Rout = maxR * (0.3 + 0.7 * Math.min(1, d.r / 250));

                for (let i = 0; i < cnt; i++) {

                  c.beginPath(); c.arc(cx + R * Math.cos(a), cy + R * Math.sin(a), valence ? 4.5 : 3.2, 0, 7);
                  c.fillStyle = valence ? t.orange : t.blue; c.fill();
                }
              });
              const nr = Math.max(10, 6 + Math.sqrt(Z) * 1.5);
              const g = c.createRadialGradient(cx - nr / 3, cy - nr / 3, 1, cx, cy, nr);
              g.addColorStop(0, U.shade(t.red, 0.4)); g.addColorStop(1, t.red);
              c.beginPath(); c.arc(cx, cy, nr, 0, 7); c.fillStyle = g; c.fill();
              U.text(c, '+' + Z, cx, cy + 4, { align: 'center', color: '#fff', weight: 700, size: 12 });
              U.text(c, ELEMENTS.byZ[Z].sym, 12, 22, { size: 20, weight: 700 });
              U.text(c, '● core', 12, H - 26, { size: 11, color: t.blue });
              U.text(c, '● valence', 12, H - 10, { size: 11, color: t.orange });

          function refresh() {

          const stats = U.stats([['f', 'Force ∝ q₁q₂/r²'], ['e', 'Energy ∝ q₁q₂/r'], ['t', 'Interaction']]);
          const cv = U.canvas(null, { aspect: 2.6, scope: s, draw: (c, w, H) => {
            const t = U.theme(), cy = H / 2, scale = (w - 120) / 6;
            const x1 = w / 2 - r * scale / 2, x2 = w / 2 + r * scale / 2;
            const ball = (x, q) => {

              const gr = c.createRadialGradient(x - R / 3, cy - R / 3, 2, x, cy, R);
              gr.addColorStop(0, U.shade(col, 0.5)); gr.addColorStop(1, col);
              c.beginPath(); c.arc(x, cy, R, 0, 7); c.fillStyle = gr; c.fill();
              U.text(c, (q > 0 ? '+' : '−') + (Math.abs(q) > 1 ? Math.abs(q) : ''), x, cy + 5, { align: 'center', color: '#fff', weight: 700, size: 15 });
            };
            const F = q1 * q2 / (r * r);
            const len = U.clamp(Math.abs(F) * 40, 8, 90), col = F < 0 ? t.good : t.bad;
            if (F < 0) { U.arrow(c, x1 + 30, cy - 40, x1 + 30 + len, cy - 40, col, 3); U.arrow(c, x2 - 30, cy - 40, x2 - 30 - len, cy - 40, col, 3); }
            else { U.arrow(c, x1, cy - 40, x1 - len, cy - 40, col, 3); U.arrow(c, x2, cy - 40, x2 + len, cy - 40, col, 3); }
            c.strokeStyle = t.ink3; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(x1, cy + 40); c.lineTo(x2, cy + 40); c.stroke(); c.setLineDash([]);
            U.text(c, 'r = ' + r.toFixed(1), w / 2, cy + 56, { align: 'center', mono: true, color: t.ink2 });

        const cols = 6, rows = 3, gx = w / (cols + 1), gy = H / (rows + 1);
        c.fillStyle = U.alpha(t.blue, 0.1); c.fillRect(0, 0, w, H);
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
          const el = (i + j) % 2 ? A : B;
          U.drawAtom(c, gx * (i + 1), gy * (j + 1), 17, el, { label: el + '⁺' });
        }
        for (let k = 0; k < 40; k++) {
          const x = (k * 97.3 + time * 0.05 * (1 + (k % 5))) % w, y = (k * 53.7 + Math.sin(time / 600 + k) * 20 + H) % H;
          c.beginPath(); c.arc(x, y, 2.6, 0, 7); c.fillStyle = t.blue; c.fill();
        }
        U.text(c, 'cations in a “sea” of delocalized electrons', w / 2, H - 10, { align: 'center', size: 12, color: t.ink2 });
        return;
      }
      const shift = I.type === 'ionic' ? 1 : U.clamp(I.d / 1.8, 0, 1); // 0 equal, 1 complete
      const negIsB = I.neg === I.b && I.a.en !== I.b.en;
      const toward = negIsB ? 1 : -1;
      if (I.type === 'ionic') {
        // separate ions with transferred electron
        const pulse = (Math.sin(time / 500) + 1) / 2;
        const ex = U.lerp(negIsB ? x1 : x2, negIsB ? x2 : x1, Math.min(1, pulse * 1.4));
        const cat = negIsB ? I.a : I.b, an = negIsB ? I.b : I.a;
        const xc = negIsB ? x1 - 12 : x2 + 12, xa = negIsB ? x2 + 12 : x1 - 12;
        const ga = c.createRadialGradient(xa, cy, 4, xa, cy, r2 + 30);
        ga.addColorStop(0, U.alpha(t.blue, 0.55)); ga.addColorStop(1, U.alpha(t.blue, 0));
        c.fillStyle = ga; c.beginPath(); c.arc(xa, cy, r2 + 30, 0, 7); c.fill();

        U.drawAtom(c, xa, cy, (an === I.a ? r1 : r2) * 1.05, an.sym);
        U.text(c, 'cation (+)', xc, cy + r1 + 26, { align: 'center', color: t.red, weight: 600 });
        U.text(c, 'anion (−)', xa, cy + r2 + 32, { align: 'center', color: t.blue, weight: 600 });
        c.beginPath(); c.arc(ex, cy - 50, 4, 0, 7); c.fillStyle = t.orange; c.fill();
        U.text(c, 'e⁻ transferred', w / 2, cy - 62, { align: 'center', size: 11, color: t.orange, weight: 600 });
        return;
      }
      // covalent: one elongated cloud whose centre shifts toward the more EN atom
      const mid = (x1 + x2) / 2 + toward * shift * sep * 0.32;
      const steps = 26;
      for (let i = 0; i < steps; i++) {
        const u = i / (steps - 1);
        const x = U.lerp(x1 - r1, x2 + r2, u);
        const dist = Math.abs(x - mid) / (sep * 0.9);
        const a = Math.exp(-dist * dist * 2.2) * 0.12;
        const g = c.createRadialGradient(x, cy, 1, x, cy, 54);
        g.addColorStop(0, U.alpha(t.blue, a * 3)); g.addColorStop(1, U.alpha(t.blue, 0));
        c.fillStyle = g; c.beginPath(); c.arc(x, cy, 54, 0, 7); c.fill();
      }
      U.drawAtom(c, x1, cy, r1, I.a.sym);
      U.drawAtom(c, x2, cy, r2, I.b.sym);
      // shared electron pair
      const jig = Math.sin(time / 300) * 3;
      [-5, 5].forEach(dy => { c.beginPath(); c.arc(mid + jig, cy + dy, 3.3, 0, 7); c.fillStyle = t.orange; c.fill(); });
      if (I.type === 'polar') {
        U.text(c, 'δ+', negIsB ? x1 : x2, cy - Math.max(r1, r2) - 14, { align: 'center', color: t.red, weight: 700, size: 16 });
        U.text(c, 'δ−', negIsB ? x2 : x1, cy - Math.max(r1, r2) - 14, { align: 'center', color: t.blue, weight: 700, size: 16 });
        const ay = cy + Math.max(r1, r2) + 26;
        const xs = negIsB ? x1 : x2, xe = negIsB ? x2 : x1;
        U.arrow(c, xs, ay, xe, ay, t.ink, 2.5, 10);
        c.beginPath(); c.moveTo(xs + 10 * toward, ay - 7); c.lineTo(xs + 10 * toward, ay + 7); c.stroke();
        U.text(c, 'dipole', (x1 + x2) / 2, ay + 18, { align: 'center', size: 11, color: t.ink2 });
      } else U.text(c, 'electrons shared equally', w / 2, cy + Math.max(r1, r2) + 30, { align: 'center', size: 12, color: t.ink2 });
    });

    function drawBar(c, w, H) {
      const t = U.theme(), I = info(), L = 16, R = w - 16, y = 30, max = 3.3;
      const X = v => L + (R - L) * v / max;
      const zones = [[0, 0.4, t.green, 'nonpolar'], [0.4, 1.8, t.yellow, 'polar covalent'], [1.8, max, t.red, 'ionic']];
      zones.forEach(([a, b, col, lbl]) => {
        c.fillStyle = U.alpha(col, 0.28); c.fillRect(X(a), y, X(b) - X(a), 22);
        U.text(c, lbl, (X(a) + X(b)) / 2, y + 15, { align: 'center', size: 11, weight: 600, color: t.ink2 });
      });
      for (let v = 0; v <= 3; v += 0.5) U.text(c, v.toFixed(1), X(v), y + 40, { align: 'center', size: 10, mono: true, color: t.ink3 });
      U.text(c, 'ΔEN', L, 16, { size: 11, weight: 600, color: t.ink3 });
      const px = X(Math.min(max, I.d));
      c.fillStyle = t.ink; c.beginPath(); c.moveTo(px, y - 2); c.lineTo(px - 7, y - 12); c.lineTo(px + 7, y - 12); c.closePath(); c.fill();
      U.text(c, I.d.toFixed(2), px, y - 15, { align: 'center', size: 11, weight: 700, mono: true });
      U.text(c, 'Boundaries are approximate; bonding is a continuum.', L, H - 6, { size: 10.5, color: t.ink3 });
    }

    function update() {
      bar.redraw();

      U.clear(out);
      const stats = U.stats([['a', `EN of ${I.a.sym}`], ['b', `EN of ${I.b.sym}`], ['d', 'ΔEN']]);
      stats.set('a', I.a.en); stats.set('b', I.b.en); stats.set('d', I.d.toFixed(2));
      const msg = {
        nonpolar: `${I.a.sym} and ${I.b.sym} attract the shared pair about equally, so there are no significant partial charges.`,
        polar: `${I.neg.name} is more electronegative, so the shared electrons are pulled toward it: ${I.neg.sym} gets a partial negative charge (δ−) and ${I.pos.sym} gets δ+.`,
        ionic: `${I.pos.name} (a metal with low electronegativity) gives up electron(s) to ${I.neg.name}. The resulting ions are held together by Coulombic attraction in a lattice.`,
        metallic: `Both are metals. Their valence electrons are delocalized across a lattice of cations, which makes metals conductive and malleable. A mixture of metals is an alloy.`,
      }[I.type];
      out.append(U.panel(NAMES[I.type], stats.el, h('p', null, msg)));

    }
    update();
  },
});

'use strict';

  id: 'potential-energy', unit: 2, sym: 'Pe', title: 'Potential Energy & Bond Length',

  keyIdeas: [
    'As two atoms approach, attraction between each nucleus and the other atom’s electrons lowers the potential energy.',
    'Too close, nucleus–nucleus repulsion makes the energy rise steeply.',
    'The <b>minimum</b> of the curve is the bond length (equilibrium internuclear distance); its <b>depth</b> is the bond energy.',
    'Higher bond order → shorter and stronger bonds (C≡C &lt; C=C &lt; C–C in length).',
    'Larger atoms form longer, usually weaker bonds (H–F &lt; H–Cl &lt; H–Br in length).',
  ],
  render(el, scope) {
    const h = U.h;
    const BONDS = {
      'H–H': { a: 'H', b: 'H', re: 74, De: 436 }, 'H–F': { a: 'H', b: 'F', re: 92, De: 568 }, 'H–Cl': { a: 'H', b: 'Cl', re: 127, De: 431 },
      'H–Br': { a: 'H', b: 'Br', re: 141, De: 366 }, 'H–I': { a: 'H', b: 'I', re: 161, De: 298 }, 'F–F': { a: 'F', b: 'F', re: 142, De: 159 },
      'Cl–Cl': { a: 'Cl', b: 'Cl', re: 199, De: 242 }, 'Br–Br': { a: 'Br', b: 'Br', re: 228, De: 193 }, 'I–I': { a: 'I', b: 'I', re: 267, De: 151 },
      'O=O': { a: 'O', b: 'O', re: 121, De: 498, order: 2 }, 'N≡N': { a: 'N', b: 'N', re: 110, De: 945, order: 3 },
      'C–C': { a: 'C', b: 'C', re: 154, De: 347 }, 'C=C': { a: 'C', b: 'C', re: 134, De: 614, order: 2 }, 'C≡C': { a: 'C', b: 'C', re: 120, De: 839, order: 3 },
    };
    let key = 'H–H', cmp = 'none', r = 74 * 2.2;
    const V = (b, x) => { const a = 1.5 / b.re * 1.25; const e = 1 - Math.exp(-a * (x - b.re)); return b.De * e * e - b.De; };
    const names = Object.keys(BONDS);
    const sel = U.select({ label: 'Bond', options: names, value: key, onChange: v => { key = v; r = BONDS[key].re * 2.2; slider.set(r); redraw(); } });
    const sel2 = U.select({ label: 'Compare with', options: [{ value: 'none', label: 'None' }].concat(names.map(n => ({ value: n, label: n }))), value: cmp, onChange: v => { cmp = v; redraw(); } });
    const slider = U.slider({ label: 'Internuclear distance', min: 40, max: 420, step: 1, value: r, unit: 'pm', onInput: v => { r = v; redraw(); } });
    const stats = U.stats([['r', 'Distance'], ['e', 'Potential energy'], ['z', 'Region']]);
    const atoms = U.canvas(null, { height: 130, scope, drag: true, hint: 'drag the right atom', draw: drawAtoms });
    const cv = U.canvas(null, { aspect: 1.7, scope, drag: true, draw: drawCurve });
    let P = null;
    el.append(h('div', { class: 'grid-viz' },
      h('div', { class: 'stack' }, U.panel('Two atoms', atoms.wrap), U.panel('Potential energy curve', cv.wrap)),
      h('div', { class: 'stack' }, U.panel('Settings', sel.el, sel2.el, slider.el, h('div', { class: 'row' }, U.btn('Jump to bond length', () => { r = BONDS[key].re; slider.set(r); redraw(); }, 'sm primary'))), stats.el,
        U.panel('Data', U.table(['Bond', 'Length (pm)', 'Energy (kJ/mol)'], names.map(n => [n, BONDS[n].re, BONDS[n].De]), { num: [1, 2] })))));

    function drawAtoms(c, w, H) {
      const t = U.theme(), b = BONDS[key];
      const scale = (w - 80) / 440;
      const x1 = 40, x2 = 40 + r * scale, cy = H / 2;
      const ra = (ELEMENTS.bySym[b.a].radius) * scale * 0.9, rb = (ELEMENTS.bySym[b.b].radius) * scale * 0.9;
      // electron clouds
      [[x1, ra], [x2, rb]].forEach(([x, R]) => {
        const g = c.createRadialGradient(x, cy, 1, x, cy, R * 2.2);
        g.addColorStop(0, U.alpha(t.blue, 0.35)); g.addColorStop(1, U.alpha(t.blue, 0));
        c.fillStyle = g; c.beginPath(); c.arc(x, cy, R * 2.2, 0, 7); c.fill();
      });
      U.drawAtom(c, x1, cy, Math.max(12, ra), b.a);
      U.drawAtom(c, x2, cy, Math.max(12, rb), b.b);
      c.strokeStyle = t.ink3; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(x1, cy + 36); c.lineTo(x2, cy + 36); c.stroke(); c.setLineDash([]);
      U.text(c, Math.round(r) + ' pm', (x1 + x2) / 2, cy + 52, { align: 'center', mono: true, size: 11, color: t.ink2 });
    }
    U.drag(atoms, { down: () => true, move: p => { const scale = (atoms.w - 80) / 440; r = U.clamp((p.x - 40) / scale, 40, 420); slider.set(Math.round(r)); redraw(); } }, scope);
    U.drag(cv, { down: p => P && P.inside(p.x, p.y), move: p => { r = U.clamp(P.invX(p.x), 40, 420); slider.set(Math.round(r)); redraw(); } }, scope);

    function drawCurve(c, w, H) {
      const t = U.theme(), b = BONDS[key], b2 = cmp !== 'none' ? BONDS[cmp] : null;
      const depth = Math.max(b.De, b2 ? b2.De : 0);
      P = new U.Plot(c, w, H, { x: [40, 420], y: [-depth * 1.15, depth * 0.9], xlabel: 'Internuclear distance (pm)', ylabel: 'Potential energy (kJ/mol)' });
      P.axes();

      if (b2) { P.fn(x => V(b2, x), t.orange, 2.2, [6, 4]); P.dot(b2.re, -b2.De, t.orange, 4); P.label(cmp, b2.re, -b2.De, t.orange, { dy: 18, align: 'center' }); }
      P.fn(x => V(b, x), t.accent, 2.8);
      // annotations
      P.vline(b.re, U.alpha(t.good, 0.9), [4, 4]);
      P.label('bond length ' + b.re + ' pm', b.re, -depth * 1.1, t.good, { dx: 6, dy: 4 });
      const c0 = P.Y(0), cmin = P.Y(-b.De), xx = P.X(Math.min(410, b.re * 2.6));
      c.strokeStyle = t.purple; c.lineWidth = 1.5; c.beginPath(); c.moveTo(xx, c0); c.lineTo(xx, cmin); c.stroke();
      U.text(c, 'bond energy', xx + 6, (c0 + cmin) / 2 - 6, { color: t.purple, size: 11, weight: 600 });
      U.text(c, b.De + ' kJ/mol', xx + 6, (c0 + cmin) / 2 + 8, { color: t.purple, size: 11, mono: true });
      c.strokeStyle = U.alpha(t.purple, 0.4); c.setLineDash([2, 3]); c.beginPath(); c.moveTo(P.X(b.re), cmin); c.lineTo(xx, cmin); c.stroke(); c.setLineDash([]);
      P.dot(r, V(b, r), t.red, 6.5);
    }
    function redraw() {
      atoms.redraw(); cv.redraw();
      const b = BONDS[key], E = V(b, r);
      stats.set('r', Math.round(r) + ' pm'); stats.set('e', E.toFixed(0) + ' kJ/mol');
      const reg = r < b.re * 0.97 ? '<span style="color:var(--bad)">repulsion dominates</span>' : r > b.re * 1.03 ? (E > -b.De * 0.05 ? 'almost no interaction' : '<span style="color:var(--good)">net attraction</span>') : '<b>at bond length</b>';
      stats.set('z', reg);
    }
    redraw();
  },
});

    '<b>Ionic solids</b>: lattice of cations and anions. High melting points, brittle, conduct only when melted or dissolved.',

    '<b>Alloys</b>: substitutional (atoms of similar size replace each other, e.g. brass) or interstitial (small atoms fill holes, e.g. steel), which makes the metal less malleable.',
    '<b>Covalent network solids</b> (diamond, SiO<sub>2</sub>): every atom covalently bonded. Very hard with very high melting points.',
    '<b>Molecular solids</b>: molecules held by intermolecular forces. Low melting points, soft, non-conducting.',
    'Lattice energy grows with ion charge and shrinks with ion size (Coulomb’s law): MgO ≫ NaCl.',

        network: { name: 'Covalent network solid', ex: 'Diamond, graphite, SiO₂ (quartz), SiC', particles: 'Atoms', forces: 'Covalent bonds throughout', mp: 'Very high (diamond > 3500 °C)', cond: 'Usually no (graphite is an exception)', mech: 'Very hard', stressNote: 'Every atom is held by strong covalent bonds, so deforming the solid means breaking bonds.' },

  draw(c, w, H, s, o = {}) {

    const cx = w / 2 - (minX + maxX) / 2 * L, cy = H / 2 + (minY + maxY) / 2 * L;
    const P = a => [cx + a.x * L, cy - a.y * L];

    const elCol = el => ({ O: t.red, N: t.blue, F: t.green, Cl: t.green, S: t.yellow, P: t.orange, Br: '#b0503b', I: t.purple, Xe: t.teal, B: t.pink, Be: t.teal })[el] || t.ink;
    const gap = fs * 0.62;

    // bonds
    s.bonds.forEach(b => {

      const d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d, nx = -uy, ny = ux;
      const offs = b.order === 1 ? [0] : b.order === 2 ? [-3.5, 3.5] : [-6, 0, 6];
      c.strokeStyle = o.highlightBond && o.highlightBond(b) ? t.orange : t.ink; c.lineWidth = 2;
      offs.forEach(k => {
        c.beginPath(); c.moveTo(x1 + ux * gap + nx * k, y1 + uy * gap + ny * k); c.lineTo(x2 - ux * gap + nx * k, y2 - uy * gap + ny * k); c.stroke();
      });
    });

    s.atoms.forEach(a => {
      const [x, y] = P(a);
      U.text(c, a.el, x, y + fs * 0.36, { align: 'center', size: fs, weight: 700, color: elCol(a.el) });

        const i = s.atoms.indexOf(a);
        const dirs = s.bonds.filter(b => b.a === i || b.b === i).map(b => { const q = s.atoms[b.a === i ? b.b : b.a]; return Math.atan2(q.y - a.y, q.x - a.x); }).concat(o.lonePairs === false ? [] : (a.lpDirs || []));

        U.text(c, (Math.abs(a.fc) > 1 ? Math.abs(a.fc) : '') + (a.fc > 0 ? '+' : '−'), fx, fy + 3.8, { align: 'center', size: 10.5, weight: 700, color: '#fff' });
      }
    });

      const x0 = cx + minX * L - fs * 1.6, x1 = cx + maxX * L + fs * 1.6, y0 = cy - maxY * L - fs * 1.4, y1 = cy - minY * L + fs * 1.4;

    }
  },
};

  rotate(p, rot) {

  draw(c, w, H, model, rot, o = {}) {

      const A = proj(base), T = proj(tip), M = proj(mid);
      items.push({ z: M.z, draw() {
        const dx = T.x - A.x, dy = T.y - A.y, len = Math.hypot(dx, dy);

        c.save(); c.translate((A.x + T.x) / 2, (A.y + T.y) / 2); c.rotate(ang);
        const g = c.createRadialGradient(lenW * 0.15, 0, 2, 0, 0, lenW * 0.6);
        g.addColorStop(0, U.alpha(t.purple, 0.55)); g.addColorStop(1, U.alpha(t.purple, 0.12));
        c.beginPath(); c.ellipse(0, 0, lenW * 0.55, S * 0.2 * M.s, 0, 0, 7); c.fillStyle = g; c.fill();
        c.strokeStyle = U.alpha(t.purple, 0.6); c.lineWidth = 1; c.stroke();

  smallestPair(model) {

  dipole(m) {

  /** home-page hero: rotating molecules */
  hero(container, scope) {

    });
  },
};

        CO2: { name: 'Carbon dioxide', tp: [-56.6, 5.11], cp: [31.0, 72.8], nbp: null, nmp: null, slope: 0.017, Tr: [-120, 80] },
      };

      const seg = U.seg({ options: [{ value: 'H2O', label: 'Water (H₂O)' }, { value: 'CO2', label: 'Carbon dioxide (CO₂)' }], value: key, onChange: v => { key = v; if (v === 'CO2') { T = -78; Pa = 1; } else { T = 25; Pa = 1; } upd(); } });
      const stats = U.stats([['t', 'Temperature'], ['p', 'Pressure'], ['ph', 'Phase']]);
      const note = h('div');
      let Pl = null;
      const cv = U.canvas(null, { aspect: 1.35, scope: s, drag: true, hint: 'drag the point', draw });
      const box = U.canvas(null, { aspect: 1.4, scope: s });
      b.append(h('div', { class: 'grid-viz' }, U.panel(null, seg.el, cv.wrap), h('div', { class: 'stack' }, stats.el, U.panel('Particle view', box.wrap), note)));
      // curves (T in °C, P in atm)
      const K = c => c + 273.15;
      function vapP(S, Tc) { // ln P linear in 1/T through triple & critical points

      }
      const meltT = (S, P) => S.tp[0] + S.slope * (P - S.tp[1]);
      function phase(S, Tc, P) {

        Pl.axes();

        const regions = [];
        for (let i = 0; i <= 60; i++) for (let j = 0; j <= 40; j++) {

        pts.push([S.cp[0], L(S.cp[1])]);

        Pl.line(sp, t.ink, 2.4);

        if (key === 'H2O') { lab('SOLID', -35, 1.8, t.blue); lab('LIQUID', 150, 2.2, t.teal); lab('GAS', 250, -1.8, t.orange); }
        else { lab('SOLID', -95, 2.2, t.blue); lab('LIQUID', 0, 2.4, t.teal); lab('GAS', 10, -1.5, t.orange); }

      s.loop((dt, time) => {

        c.clearRect(0, 0, w, H);

    'K = [products]<sup>coefficients</sup> / [reactants]<sup>coefficients</sup>. Pure solids and liquids are left out.',
    'K ≫ 1: products favored at equilibrium. K ≪ 1: reactants favored.',

  },
  pHstrong(Cacid, Cbase) { const H = this.solveH(h => h + Cbase - this.Kw / h - Cacid); return -Math.log10(H); },

        c.strokeStyle = U.alpha(t.ink3, 0.8); c.lineWidth = 14; c.lineCap = 'butt';

        stats.set('e0', '+' + I.E0.toFixed(2) + ' V'); stats.set('e', (I.E >= 0 ? '+' : '') + I.E.toFixed(3) + ' V');

        out.append(U.panel('Faraday’s law', h('div', { class: 'eq wrap', html: `q = I·t = (${I.toFixed(1)} A)(${tmin} min × 60 s/min) = ${q.toFixed(0)} C<br>mol e⁻ = q/F = ${q.toFixed(0)} / 96,485 = ${mol.toFixed(4)} mol<br>mol ${sym} = mol e⁻ / ${n} = ${(mol / n).toFixed(4)} mol<br>mass = ${(mol / n).toFixed(4)} mol × ${M} g/mol = <b>${mass.toFixed(3)} g ${sym}</b>` }),

/* App shell: navigation, search, routing (#topic-id), theme, home page. Loaded last. */
'use strict';
(function () {
  const $ = s => document.querySelector(s);

  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  const themeBtn = $('#themeBtn');
  const paintThemeBtn = () => { themeBtn.innerHTML = effectiveDark() ? SUN : MOON; themeBtn.title = effectiveDark() ? 'Switch to light mode' : 'Switch to dark mode'; };
  const saved = U.store.get('theme', null);
  if (saved) root.dataset.theme = saved;
  paintThemeBtn();
  themeBtn.addEventListener('click', () => {
    const t = effectiveDark() ? 'light' : 'dark';
    root.dataset.theme = t;

  });
  sysDark.addEventListener('change', () => { paintThemeBtn(); U.themeChanged(); });

  /* ---------- mobile drawer ---------- */
  $('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));

  /* ---------- tiles ---------- */
  const unitColor = n => `var(--u${n})`;
  U.tile = (m, small) => {
    const t = h('div', { class: 'tile' + (small ? ' sm' : '') }, h('span', { class: 't-n' }, App.number(m)), h('span', { class: 't-s' }, m.sym));
    t.style.setProperty('--uc', unitColor(m.unit));

  };

  /* ---------- navigation ---------- */
  const openUnits = new Set(U.store.get('openUnits', [1]));
  const navLinks = [];
  function buildNav() {
    U.clear(nav);
    nav.appendChild(h('a', { class: 'nav-home', href: '#home', 'data-id': 'home' },

      'Home'));
    const order = App.units.filter(u => u.n !== 0).concat(App.units.filter(u => u.n === 0));
    for (const u of order) {
      const mods = App.unitModules(u.n);
      if (!mods.length) continue;
      if (u.n === 0) nav.appendChild(h('div', { class: 'nav-sep' }));
      const box = h('div', { class: 'nav-unit' + (openUnits.has(u.n) ? ' open' : '') });
      box.style.setProperty('--uc', unitColor(u.n));
      box.dataset.unit = u.n;
      const btn = h('button', { type: 'button', 'aria-expanded': openUnits.has(u.n) },

        h('span', { class: 'u-title' }, u.title),
        h('span', { class: 'chev', html: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>' }));
      btn.addEventListener('click', () => {
        box.classList.toggle('open');

        U.store.set('openUnits', [...openUnits]);
      });
      const ul = h('ul');

        const a = h('a', { href: '#' + m.id, 'data-id': m.id }, h('span', { class: 'n' }, App.number(m)), h('span', null, m.title));
        navLinks.push({ a, m, li: h('li', null, a), box });
        ul.appendChild(navLinks[navLinks.length - 1].li);
      }
      box.append(btn, ul);
      nav.appendChild(box);
    }
    nav.appendChild(h('div', { class: 'nav-empty', id: 'navEmpty', hidden: true }, 'No topics match.'));
  }
  function filterNav(q) {
    q = q.trim().toLowerCase();
    let any = 0;
    const boxes = new Map();
    for (const l of navLinks) {
      const hay = (l.m.title + ' ' + l.m.desc + ' ' + l.m.tags.join(' ') + ' ' + App.number(l.m)).toLowerCase();
      const ok = !q || q.split(/\s+/).every(w => hay.includes(w));
      l.li.hidden = !ok;
      if (ok) { any++; boxes.set(l.box, true); } else if (!boxes.has(l.box)) boxes.set(l.box, false);
    }
    for (const [box, ok] of boxes) {
      box.hidden = !!q && !ok;
      if (q) box.classList.toggle('open', ok);
      else box.classList.toggle('open', openUnits.has(+box.dataset.unit));
    }
    $('#navEmpty').hidden = any > 0;
    return navLinks.filter(l => !l.li.hidden);
  }
  search.addEventListener('input', () => filterNav(search.value));

    if (e.key === 'Enter') { const r = filterNav(search.value); if (r.length) location.hash = r[0].m.id; }

  });

      if (!mods.length) continue;
      const card = h('article', { class: 'unit-card' },
        h('header', null,
          (() => { const t = h('div', { class: 'tile sm' }, h('span', { class: 't-n' }, u.n === 0 ? '' : 'Unit'), h('span', { class: 't-s' }, u.n === 0 ? '★' : String(u.n))); t.style.setProperty('--uc', unitColor(u.n)); return t; })(),
          h('div', null, h('span', { class: 'eyebrow' }, u.n === 0 ? 'Tools' : 'Unit ' + u.n), h('h3', null, u.title))),
        h('ul', null, mods.map(m => h('li', null, h('a', { href: '#' + m.id }, h('span', { class: 'sym' }, App.number(m)), h('span', null, m.title, h('span', { class: 'd' }, m.desc)))))));
      card.style.setProperty('--uc', unitColor(u.n));
      grid.appendChild(card);
    }
    page.appendChild(grid);
    main.appendChild(page);
    document.title = 'Valence AP Chemistry';
  }

  function route() {
    const id = decodeURIComponent(location.hash.slice(1)) || 'home';
    if (scope) scope.dispose();
    scope = new U.Scope();
    U.clear(main);
    window.scrollTo(0, 0);
    const m = App.byId[id];
    if (m) renderModule(m); else renderHome();
    for (const a of nav.querySelectorAll('a[data-id]')) a.classList.toggle('active', a.dataset.id === (m ? m.id : 'home'));
    if (m) {
      const l = navLinks.find(x => x.m === m);
      if (l && !l.box.classList.contains('open') && !search.value) { l.box.classList.add('open'); openUnits.add(m.unit); }
      const act = nav.querySelector('a.active');
      if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
    }
    document.body.classList.remove('nav-open');
  }

  buildNav();
  window.addEventListener('hashchange', route);
  if (typeof MOLECULES !== 'undefined') MOLECULES.validate();
  route();
})();

</script>
</body>
</html>
